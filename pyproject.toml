[tool.poetry]
name = "s2sprosody"
version = "0.1.0"
description = ""
authors = ["T0RA <torapira@icloud.com>"]
readme = "README.md"

packages = [
    { include = "FastSpeech2", from = "src/comparison" },
    { include = "GloFE", from = "src/comparison" },
]

[tool.poetry.dependencies]
python = "3.9.0"
pandas = "2.2.2"
transformers = "4.43.4"
tensorboardX = "2.6.2.2"
einops = "0.8.0"
torchvision = "0.14.1"
torchaudio = "0.13.1"
cuda-python = "11.8.0"
g2p-en = "2.1.0"
inflect = "4.1.0"
librosa = "0.7.2"
matplotlib = "3.2.2"
numba = "^0.60.0"
numpy = "1.22.4"
pypinyin = "0.39.0"
pyworld = "^0.3.4"
PyYAML = "6.0"
scikit-learn = "0.24.0"
scipy = "1.7.2"
soundfile = "0.10.3.post1"
tensorboard = "2.2.2"
tgt = "1.4.4"
torch = "1.13.1"
tqdm = "4.46.1"
Unidecode = "1.1.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
