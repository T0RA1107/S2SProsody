dataset: "VCTK"

path:
  corpus_path: "/home/ubuntu/slocal/S2SProsody/data/VCTK-Corpus"
  lexicon_path: "/home/ubuntu/slocal/S2SProsody/data/VCTK-Corpus/processed/mfa_dict.txt"
  raw_path: "/home/ubuntu/slocal/S2SProsody/data/VCTK-Corpus/mfa_inputs"
  preprocessed_path: "/home/ubuntu/slocal/S2SProsody/data/VCTK-Corpus/preprocess"

preprocessing:
  val_size: 512
  text:
    text_cleaners: ["english_cleaners"]
    language: "en"
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000 # please set to 8000 for HiFi-GAN vocoder, set to null for MelGAN vocoder
  pitch:
    feature: "phoneme_level" # support 'phoneme_level' or 'frame_level'
    normalization: True
  energy:
    feature: "phoneme_level" # support 'phoneme_level' or 'frame_level'
    normalization: True

preprocessing_sign:
  feat_path: "/home/ubuntu/slocal/S2SProsody/data/OpenASL/data/mmpose"
  label_path: "/home/ubuntu/slocal/S2SProsody/data/OpenASL/data/openasl-v1.0.tsv"
  translation_token_ids: "/home/ubuntu/slocal/S2SProsody/data/OpenASL/data/translation_token_ids.txt"
  eos_token: "."
  clip_length: 128
  prefix_dim: 2048
