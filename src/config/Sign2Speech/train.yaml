path:
  ckpt_path: "./output/ckpt/Sign2Speech"
  log_path: "./output/log/Sign2Speech"
  result_path: "./output/result/Sign2Speech"

fine-tuning: "./FastSpeech2/config/VCTK"

optimizer:
  batch_size: 64 # 16
  lr_G_s2a: 0.00001
  lr_D_a: 0.001
  lr_fine-tuning: 0.001
  betas: [0.9, 0.98]
  eps: 0.000000001
  weight_decay: 0.0
  grad_clip_thresh: 1.0
  grad_acc_step: 1
  warm_up_step: 4000
  anneal_steps: [300000, 400000, 500000]
  anneal_rate: 0.3

dataset:
  serial_batches: False

GAN:
  gan_mode: lsgan
  pool_size: 50
  lr_policy: cosine
  lr_decay_iters: 50

gpu_ids: [0, 1, 2]

step:
  total_step: 100 # 900000
  step_count: 0
  log_step: 100
  synth_step: 100
  val_step: 1000
  save_step: 1000
  n_epochs_decay: 0
